name: Build & Test (Dev)

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*.*.*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for semantic versioning

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version from Git tag
        id: version
        run: |
          $tag = git describe --tags --abbrev=0 2>$null
          if ($tag) {
            $version = $tag -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+') {
              $version = "0.0.0-$version"
            }
            Write-Host "Version from tag: $version"
            echo "version=$version" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No tag found, using default version"
            echo "version=1.0.0" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Restore dependencies
        run: dotnet restore src\IoTPowerShellAgent\IoTPowerShellAgent.csproj

      - name: Build
        run: dotnet build src\IoTPowerShellAgent\IoTPowerShellAgent.csproj --configuration Debug /p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test src\IoTPowerShellAgent.Tests\IoTPowerShellAgent.Tests.csproj --configuration Debug --logger trx

      - name: Run Pester Tests
        shell: pwsh
        run: |
          if (Test-Path "src\IoTPowerShellAgent.Tests.Pester\run-pester.ps1") {
            Set-Location src\IoTPowerShellAgent.Tests.Pester
            .\run-pester.ps1 -OutputFormat NUnitXml -OutputFile PesterResults.xml
            Set-Location ..\..
          } else {
            Write-Host "Pester tests not found, skipping..."
          }

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        with:
          files: "**/*.trx,**/PesterResults.xml"
