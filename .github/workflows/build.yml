name: CI

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
          - All
      targetFramework:
        description: 'Target framework'
        required: true
        default: 'net8.0-windows'
      noRestore:
        description: 'Skip dotnet restore'
        required: false
        default: 'false'
        type: boolean
      verbose:
        description: 'Verbose dotnet output'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest
    # Run this matrix row only if user asked for All or it matches the chosen configuration
    if: ${{ github.event.inputs.configuration == 'All' || matrix.configuration == github.event.inputs.configuration }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    env:
      PROJECT_PATH: src/IoTPowerShellAgent/IoTPowerShellAgent.csproj
      TARGET_FRAMEWORK: ${{ github.event.inputs.targetFramework }}
      VERBOSE_FLAG: ${{ github.event.inputs.verbose == 'true' ? '--verbosity detailed' : '--verbosity minimal' }}
      NO_RESTORE_FLAG: ${{ github.event.inputs.noRestore == 'true' ? '--no-restore' : '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Show .NET SDK version
        run: dotnet --version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # fallback to OS-based key if no lock file is present
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore (conditional)
        if: ${{ github.event.inputs.noRestore != 'true' }}
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        shell: pwsh
        run: |
          Write-Host "Building project: $env:PROJECT_PATH"
          Write-Host "Configuration: ${{ matrix.configuration }}"
          Write-Host "Framework: $env:TARGET_FRAMEWORK"
          dotnet build "$env:PROJECT_PATH" `
            --configuration "${{ matrix.configuration }}" `
            --framework "$env:TARGET_FRAMEWORK" `
            --no-incremental `
            $env:NO_RESTORE_FLAG `
            $env:VERBOSE_FLAG `
            /p:BuildInParallel=true `
            /p:Deterministic=true `
            /p:EnableSourceLink=true `
            /p:GenerateAssemblyInfo=true

      - name: Show output file info (if present)
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $PWD "src/IoTPowerShellAgent/bin/${{ matrix.configuration }}/$($env:TARGET_FRAMEWORK)"
          Write-Host "Looking for output in: $out"
          if (Test-Path $out) {
            Get-ChildItem -Path $out -File -Recurse | ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "$($_.FullName) - $sizeMB MB"
            }
          } else {
            Write-Host "Output directory not found."
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IoTPowerShellAgent-${{ matrix.configuration }}
          path: src/IoTPowerShellAgent/bin/${{ matrix.configuration }}/$${{ github.event.inputs.targetFramework }}
